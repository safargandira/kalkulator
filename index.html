<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --latar: #d9e3df;
    --badan: #1f2a2e;
    --layar: #14201f;
    --teks-layar: #e8f3ef;
    --tombol: #f4f7f6;
    --teks-tombol: #1f2a2e;
    --operator: #2f6f6a;
    --teks-operator: #ffffff;
    --sama-dengan: #e2a93b;
    --hapus: #c9d6d2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--latar);
    font-family: "Manrope", system-ui, sans-serif;
    padding: 15px;
  }
  .kalkulator {
    width: min(100%, 340px);
    background: var(--badan);
    border-radius: 28px;
    padding: 18px;
    box-shadow: 0 18px 40px rgba(31, 42, 46, .25);
  }
  .layar {
    background: var(--layar);
    color: var(--teks-layar);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 16px;
    text-align: right;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  .riwayat { font-size: 14px; opacity: .6; min-height: 20px; overflow-wrap: anywhere; }
  .nilai { font-size: 38px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.15; }
  .nilai.galat { font-size: 18px; color: #ffb4a2; }
  .tombol { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button {
    font: inherit;
    font-size: 20px;
    font-weight: 700;
    height: 58px;
    border: 0;
    border-radius: 16px;
    background: var(--tombol);
    color: var(--teks-tombol);
    cursor: pointer;
    transition: transform .08s ease, filter .15s ease;
  }
  button:active { transform: scale(.95); }
  button:hover { filter: brightness(.96); }
  button:focus-visible { outline: 3px solid var(--sama-dengan); outline-offset: 2px; }
  button.op { background: var(--operator); color: var(--teks-operator); }
  button.hapus { background: var(--hapus); }
  button.sd { background: var(--sama-dengan); grid-row: span 2; height: auto; }
  button.nol { grid-column: span 2; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
  <main class="kalkulator" aria-label="Kalkulator">
    <div class="layar" aria-live="polite">
      <div class="riwayat" id="riwayat"></div>
      <div class="nilai" id="nilai">0</div>
    </div>
    <div class="tombol" id="tombol">
      <button class="hapus nol" data-aksi="ac">AC</button>
      <button class="hapus" data-aksi="hapus" aria-label="Hapus satu karakter">⌫</button>
      <button class="op" data-isi="÷">÷</button>

      <button data-isi="7">7</button>
      <button data-isi="8">8</button>
      <button data-isi="9">9</button>
      <button class="op" data-isi="×">×</button>

      <button data-isi="4">4</button>
      <button data-isi="5">5</button>
      <button data-isi="6">6</button>
      <button class="op" data-isi="-">−</button>

      <button data-isi="1">1</button>
      <button data-isi="2">2</button>
      <button data-isi="3">3</button>
      <button class="op" data-isi="+">+</button>

      <button class="nol" data-isi="0">0</button>
      <button data-isi=".">,</button>
      <button class="sd" data-aksi="hitung" aria-label="Hitung">=</button>
    </div>
  </main>

<script>
  const nilaiEl = document.getElementById("nilai");
  const riwayatEl = document.getElementById("riwayat");
  let ekspresi = "";
  let baruSelesai = false;

  function tampil(teks, galat = false) {
    nilaiEl.textContent = (teks || "0").replace(/\./g, ",");
    nilaiEl.classList.toggle("galat", galat);
  }

  async function hitung() {
    if (!ekspresi) return;
    try {
      const res = await fetch("/api/hitung", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ekspresi })
      });
      const data = await res.json();
      if (!res.ok) { tampil(data.error, true); ekspresi = ""; return; }
      riwayatEl.textContent = ekspresi.replace(/\./g, ",") + " =";
      ekspresi = data.hasil;
      baruSelesai = true;
      tampil(ekspresi);
    } catch (e) {
      tampil("Server tidak terjangkau", true);
    }
  }

  function isi(karakter) {
    const operator = "+-×÷".includes(karakter);
    if (baruSelesai && !operator) { ekspresi = ""; riwayatEl.textContent = ""; }
    baruSelesai = false;
    const akhir = ekspresi.slice(-1);
    if (operator && "+-×÷".includes(akhir)) ekspresi = ekspresi.slice(0, -1);
    if (operator && !ekspresi && karakter !== "-") return;
    ekspresi += karakter;
    tampil(ekspresi);
  }

  document.getElementById("tombol").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const aksi = b.dataset.aksi;
    if (aksi === "ac") { ekspresi = ""; riwayatEl.textContent = ""; tampil("0"); }
    else if (aksi === "hapus") { ekspresi = ekspresi.slice(0, -1); tampil(ekspresi); }
    else if (aksi === "hitung") hitung();
    else if (b.dataset.isi) isi(b.dataset.isi);
  });

  document.addEventListener("keydown", (e) => {
    if (/^[0-9.]$/.test(e.key)) isi(e.key);
    else if ("+-".includes(e.key)) isi(e.key);
    else if (e.key === "*") isi("×");
    else if (e.key === "/") { e.preventDefault(); isi("÷"); }
    else if (e.key === "Enter" || e.key === "=") { e.preventDefault(); hitung(); }
    else if (e.key === "Backspace") { ekspresi = ekspresi.slice(0, -1); tampil(ekspresi); }
    else if (e.key === "Escape") { ekspresi = ""; riwayatEl.textContent = ""; tampil("0"); }
  });
</script>
</body>
</html>
